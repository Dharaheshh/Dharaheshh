name: Profile Cards

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render profile cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Dharaheshh
          cards: overview,contributions,composition,rhythm,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: 'chore(profile): refresh self-hosted activity cards [skip ci]'
